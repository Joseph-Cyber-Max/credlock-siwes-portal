name: Deploy Apps Script Backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-appscript.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Link Apps Script project
        working-directory: apps-script
        run: |
          printf '{"scriptId":"1yVvg8uVePVjXCUB4q9YWBGuG1-c6ZGaxh_RTPYABs9j2pqgAY4stujoT","rootDir":"apps-script"}\n' > ../.clasp.json
      - name: Configure Apps Script web entry and schema hook
        working-directory: apps-script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Code.js')
          s = p.read_text(encoding='utf-8')
          old = "function doGet(){return json_({success:true,service:'Credlock SIWES API',version:'3.0.0',status:'ONLINE',timestamp:new Date().toISOString()});}"
          new = '''function doGet(e){if(e&&e.parameter&&e.parameter.api==='1')return json_({success:true,service:'Credlock SIWES API',version:'3.0.0',status:'ONLINE',timestamp:new Date().toISOString()});return HtmlService.createHtmlOutput('<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}body{background:#f5f7fb}</style></head><body><iframe src="https://joseph-cyber-max.github.io/credlock-siwes-portal/" allow="camera;geolocation"></iframe></body></html>').setTitle('Credlock SIWES Portal');}'''
          if old not in s:
              raise SystemExit('Expected doGet definition was not found.')
          s = s.replace(old, new, 1)
          marker = "function ensureSchema_(){"
          if marker not in s:
              raise SystemExit('Expected ensureSchema definition was not found.')
          s = s.replace(marker, marker + "initializePortalSchema_();initializeCyberSecurityTrack_();", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Push source
        run: clasp push --force
      - name: Update existing production web app deployment
        run: clasp deploy --deploymentId AKfycbyTj3mbqgJA9ySkyr1gDUxS5tYKQs_r5hbMG53ol36pjjSkXBEUxjlG226woRADwUR-qg --description "Credlock SIWES Portal production web app"
