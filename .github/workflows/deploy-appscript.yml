name: Deploy Apps Script Backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-appscript.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Link Apps Script project
        run: |
          printf '{"scriptId":"1yVvg8uVePVjXCUB4q9YWBGuG1-c6ZGaxh_RTPYABs9j2pqgAY4stujoT","rootDir":"apps-script"}\n' > .clasp.json
      - name: Validate backend upgrade
        working-directory: apps-script
        run: |
          grep -q 'joseph-cyber-max.github.io/credlock-siwes-portal' Code.js
          grep -q 'initializePortalSchema_' Code.js
          grep -q 'initializeCyberSecurityTrack_' Code.js
          grep -q 'initializeTechnicalSupportLearning_' LearningTracks.gs
          grep -q 'register' Code.js
          grep -q 'SUPER_ADMIN_EMAIL' AccessControl.gs
      - name: Push source
        run: clasp push --force
      - name: Update existing production web app deployment
        run: clasp deploy --deploymentId AKfycbyTj3mbqgJA9ySkyr1gDUxS5tYKQs_r5hbMG53ol36pjjSkXBEUxjlG226woRADwUR-qg --description "Credlock SIWES Portal production web app"
