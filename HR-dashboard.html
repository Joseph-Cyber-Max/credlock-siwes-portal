<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Credlock — HR Dashboard</title><link rel="stylesheet" href="./css/style.css"></head><body><div class="content"><section class="pagehead"><div><span class="eyebrow">PEOPLE OPERATIONS</span><h1>HR Dashboard</h1><p>Student approvals, placements, account lifecycle and workforce support.</p></div><a class="primary" href="./">← Portal</a></section><div id="status" class="panel">Loading HR workspace…</div><div class="grid" id="metrics"></div><div class="panel"><div class="pagehead"><div><h3>Student approval queue</h3><p>Approve only after the required student information has been reviewed.</p></div></div><div class="table-card"><table><thead><tr><th>Student</th><th>Programme</th><th>Training</th><th>Institution</th><th>Status</th><th>Action</th></tr></thead><tbody id="queue"></tbody></table></div></div></div><script type="module">import {getSession,adminCall} from './js/api.js';const $=s=>document.querySelector(s);const esc=v=>String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const s=getSession();if(!s)return location.href='./#login';if(!['SUPER_ADMIN','ADMIN','HR','COORDINATOR'].includes(String(s.Role||'').toUpperCase()))return $('#status').innerHTML='<div class="error">You do not have access to HR.</div>';try{const d=await adminCall('hrDashboard');const m=d.metrics||{};$('#metrics').innerHTML=Object.entries(m).map(([k,v])=>`<div class="card"><small>${esc(k)}</small><strong>${esc(v)}</strong><span>Live record</span></div>`).join('');const rows=(d.students||[]).filter(x=>String(x.Status||'').toUpperCase()==='PENDING');$('#queue').innerHTML=rows.map(r=>`<tr><td><b>${esc(r.FullName)}</b><br><small>${esc(r.SIWESID)}</small></td><td>${esc(r.Programme)}</td><td>${esc(r.TrainingType)}</td><td>${esc(r.Institution)}</td><td>${esc(r.Status)}</td><td><button class="primary small" data-ok="${esc(r.StudentID)}">Approve</button> <button class="link-btn" data-no="${esc(r.StudentID)}">Reject</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No pending registrations.</td></tr>';document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{try{await adminCall('hrApproveStudent',{StudentID:b.dataset.ok});load()}catch(e){alert(e.message)}});document.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{const reason=prompt('Reason for rejection:','Please review the submitted information and resubmit.');if(reason===null)return;try{await adminCall('hrRejectStudent',{StudentID:b.dataset.no,Reason:reason});load()}catch(e){alert(e.message)}});$('#status').textContent='HR workspace connected to the SIWES records.'}catch(e){$('#status').innerHTML=`<div class="error">${esc(e.message)}</div>`}}load();</script></body></html>
